<!doctype html>
<html><head><meta charset="utf-8"><title>Space round a grid</title>
<style>
body { font-size: 14px; color: #0f172a; padding: 18px 22px }
h3 { font-size: 12px; color: #64748b; text-transform: uppercase; margin-top: 18px; margin-bottom: 6px }
table { width: 100%; border-collapse: collapse }
td { padding: 7px 10px; border: 1px solid #e2e8f0 }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px }
</style></head><body>

<h3>Before - no grid</h3>
<table><tr><td>one</td><td>two</td></tr></table>

<h3>A heading after a table - the gap every heading should have</h3>
<table><tr><td>one</td><td>two</td></tr></table>

<div class="cards">
  <div><h3>Left card</h3><table><tr><td>a</td><td>b</td></tr></table></div>
  <div><h3>Right card</h3><table><tr><td>c</td><td>d</td></tr></table></div>
</div>

<h3>After the grid - should sit the same distance below as the one above</h3>
<table><tr><td>one</td><td>two</td></tr></table>
</body></html>
